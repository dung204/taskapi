          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                tooManyRequests:
                  summary: "Rate limit hit"
                  value:
                    error: "too many requests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    patch:
      tags: [tasks]
      operationId: updateTask
      summary: Update a task partially
      description: |
        Only the fields present in the body are changed. `updated_at` moves only
        when a field actually changes. The update is atomic: if any field is
        invalid, or the caller's role does not allow one of them, nothing is
        changed.

        What the caller's role must allow depends on the fields sent: `status`
        needs `contributor` or better; `title`, `description` and `due_at` need
        `editor` or better; a body with both kinds needs `editor` or better (a
        contributor who sends `status` together with `title` gets 403 for the
        whole request). An empty object `{}` changes nothing and needs nothing
        beyond being able to see the task.

        Permission is checked before the values are validated, so a caller who is
        not allowed gets 403 even when a value is also invalid. A body that cannot
        be decoded at all is rejected with 400 first.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskRequest"
      responses:
        "200":
          description: The task after the update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: |
            The update is atomic: if any of these applies, nothing is changed.

            - the `id` in the path is not a valid UUID
            - the body is not valid JSON, is not an object, or a field has the wrong type (an empty body is a 400 too; send `{}` to change nothing)
            - `title` is empty or whitespace-only, or longer than 200 characters after trimming
            - `description` is longer than 2000 characters
            - `status` is `overdue` or not a known status
            - `due_at` is not an RFC 3339 date-time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidId:
                  summary: "The `id` in the path is not a UUID"
                  value:
                    error: "invalid id"
                bodyMissing:
                  summary: "The request has no body"
                  value:
                    error: "request body is required"
                bodyMalformedJson:
                  summary: "The body is cut off or is not JSON"
                  value:
                    error: "request body contains malformed JSON"
                fieldWrongType:
