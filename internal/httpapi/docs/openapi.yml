        "400":
          description: |
            - `limit` is not an integer, or is lower than 1 (a value above 100 is clamped, not an error)
            - `offset` is not an integer, or is negative
            - `status` is not one of `todo`, `doing`, `done`, `overdue` (an empty `status=` means no filter)
