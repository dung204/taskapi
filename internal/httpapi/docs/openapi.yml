          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                taskNotFound:
                  summary: "Unknown id, or someone else's task"
                  value:
                    error: "task: not found"
        "429":
          description: |
            The client IP exceeded the request rate limit that applies to every endpoint
            (token bucket per IP; IPv6 addresses are grouped by their /64). Wait at least
            `Retry-After` seconds.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                tooManyRequests:
                  summary: "Rate limit hit"
                  value:
                    error: "too many requests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    delete:
      tags: [tasks]
      operationId: deleteTask
      summary: Delete a task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "204":
          description: Deleted, no body
        "400":
          description: |
            The `id` in the path is not a valid UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidId:
                  summary: "The `id` in the path is not a UUID"
                  value:
                    error: "invalid id"
        "401":
          description: |
            The access token is not accepted. Every case gets the same message and the
            `WWW-Authenticate: Bearer` header, so the answer never says why:

            - there is no `Authorization` header, its scheme is not `Bearer`, or the token is empty
            - the token is not a JWT, is signed with another key, has the wrong issuer or audience, or has expired
            - the token's session was revoked (logout, logout-all, a password change or reset, or reuse of an old refresh token) or it was issued before the user's last "sign out everywhere"
            - the user no longer exists
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/WWWAuthenticate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unauthorized:
                  summary: "Any of the cases above"
                  value:
                    error: "unauthorized"
        "404":
          description: |
            No task has this `id`, or the task belongs to another user (the two cases are
            not told apart).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                taskNotFound:
                  summary: "Unknown id, or someone else's task"
                  value:
                    error: "task: not found"
        "429":
          description: |
            The client IP exceeded the request rate limit that applies to every endpoint
            (token bucket per IP; IPv6 addresses are grouped by their /64). Wait at least
            `Retry-After` seconds.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                tooManyRequests:
                  summary: "Rate limit hit"
                  value:
                    error: "too many requests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The access token from `POST /auth/login` or `POST /auth/refresh`. A
        missing, malformed, expired or revoked token is 401.

  parameters:
    TaskId:
      name: id
      in: path
      required: true
      description: Task ID (UUID)
      schema:
        $ref: "#/components/schemas/TaskId"

    Limit:
      name: limit
      in: query
      required: false
      description: |
        Page size. Defaults to 20. A value above 100 is not an error, it is
        clamped to 100. A value below 1 or a non-integer is rejected with 400.
      schema:
        type: integer
        minimum: 1
        default: 20

    Offset:
      name: offset
      in: query
      required: false
      description: Number of tasks to skip. Defaults to 0.
      schema:
        type: integer
        minimum: 0
        default: 0

    StatusFilter:
      name: status
      in: query
      required: false
      description: Only return tasks with this status.
      schema:
        $ref: "#/components/schemas/Status"

    RefreshTokenCookie:
      name: refresh_token
      in: cookie
      required: false
      description: |
        The refresh token, when the client chose `cookie` mode at login. Set by
        the server; browsers send it only to paths under `/auth`.
      schema:
        type: string

    OriginHeader:
      name: Origin
      in: header
      required: false
      description: |
        Sent by browsers. In `cookie` mode it must be one of the allowed
        origins when present, otherwise the request is refused with 403.
        Requests without it (not from a browser) are not checked.
      schema:
        type: string

  schemas:
    TaskId:
      type: string
      format: uuid
      description: UUIDv7, generated by the server.
      x-go-type: uuid.UUID
      x-go-type-import:
        path: uuid

    Status:
      type: string
      enum: [todo, doing, done, overdue]
      description: |
        `overdue` is set only by the server (a background worker, for tasks past
        their `due_at` that are not `done`). Clients can filter by it but cannot
        set it.
      x-go-type: task.Status
      x-go-type-import:
        path: github.com/dung204/taskapi/internal/task

    WritableStatus:
      type: string
      enum: [todo, doing, done]
      description: The statuses a client is allowed to set.
      x-go-type: task.Status
      x-go-type-import:
        path: github.com/dung204/taskapi/internal/task

    Task:
      type: object
      required: [id, title, description, status, due_at, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/TaskId"
        title:
          type: string
          description: 1 to 200 characters after trimming surrounding whitespace.
        description:
          type: string
          maxLength: 2000
        status:
          $ref: "#/components/schemas/Status"
        due_at:
          type: [string, "null"]
          format: date-time
          description: RFC 3339. `null` when the task has no due date.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 200
          description: |
            Required. 1 to 200 characters after trimming surrounding whitespace;
            a whitespace-only title is rejected.
        description:
          type: string
          maxLength: 2000
          description: Optional, defaults to an empty string.
        status:
          $ref: "#/components/schemas/WritableStatus"
          description: Optional, defaults to `todo`. `overdue` is rejected with 400.
        due_at:
          type: [string, "null"]
          format: date-time
          description: Optional, RFC 3339 (for example `2030-01-01T00:00:00Z`).
          x-go-type: string

    UpdateTaskRequest:
      type: object
      description: |
        Every field is optional; only the fields that are sent are changed.
        An empty object is valid and changes nothing. Note that sending
        `due_at: null` currently counts as "not sent" (the due date is not
        cleared).
      properties:
        title:
          type: string
          maxLength: 200
          description: 1 to 200 characters after trimming; an empty or whitespace-only title is rejected.
        description:
          type: string
          maxLength: 2000
          description: An empty string is allowed and clears the description.
        status:
          $ref: "#/components/schemas/WritableStatus"
          description: "`overdue` is rejected with 400."
        due_at:
          type: [string, "null"]
          format: date-time
          description: RFC 3339.
          x-go-type: string

    UserId:
      type: string
      format: uuid
      description: UUIDv7, generated by the server.
      x-go-type: uuid.UUID
      x-go-type-import:
        path: uuid

    Email:
      type: string
      format: email
      maxLength: 254
      description: Compared case-insensitively; stored in lower case.
      x-go-type: string

    Password:
      type: string
      minLength: 1
      maxLength: 128
      description: |
        The password as typed, for checking against the stored one (`password` of
        a login, `current_password` of a password change). Never returned.

        Only an empty value, a value longer than 128 characters (counted after
        Unicode NFKC normalization) and a value that is not valid UTF-8 are
        rejected with 400. There is no minimum length here: a password that is
        merely short is just a wrong password (401 on login, 403 on a password
        change). The 8-character minimum applies to new passwords only
        (`NewPassword`).
      x-go-type: string

    NewPassword:
      type: string
      minLength: 8
      maxLength: 128
      description: |
        8 to 128 characters, counted after Unicode NFKC normalization, and valid
        UTF-8. There are no composition rules (no required digits or symbols).
      x-go-type: string

    OneTimeToken:
      type: string
      minLength: 1
      maxLength: 128
      description: A single-use token from an email link.
      x-go-type: string

    TokenMode:
      type: string
      enum: [token, cookie]
      default: token
      description: |
        Where the refresh token is delivered. `token`: in the response body.
        `cookie`: in the `refresh_token` cookie only.

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          $ref: "#/components/schemas/NewPassword"

    EmailRequest:
      type: object
      required: [email]
      properties:
        email:
          $ref: "#/components/schemas/Email"

    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token:
          $ref: "#/components/schemas/OneTimeToken"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          $ref: "#/components/schemas/Password"
        token_mode:
          $ref: "#/components/schemas/TokenMode"

    RefreshRequest:
      type: object
      description: |
        Optional. Leave the body out, or send `{}`, when the refresh token is in
        the cookie.
      properties:
        refresh_token:
          type: string
          maxLength: 128
          description: The opaque refresh token.

    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      properties:
        token:
          $ref: "#/components/schemas/OneTimeToken"
        new_password:
          $ref: "#/components/schemas/NewPassword"

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          $ref: "#/components/schemas/Password"
        new_password:
          $ref: "#/components/schemas/NewPassword"

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: |
            A signed JWT. Send it in the `Authorization` header as `Bearer <token>`.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          format: int64
          minimum: 1
          description: Seconds until the access token expires.
        refresh_token:
          type: string
          description: |
            The opaque refresh token. Present only in `token` mode, and absent
            from a grace-period answer of `POST /auth/refresh`.

    User:
      type: object
      required: [id, email, email_verified, created_at]
      properties:
        id:
          $ref: "#/components/schemas/UserId"
        email:
          $ref: "#/components/schemas/Email"
        email_verified:
          type: boolean
        created_at:
          type: string
          format: date-time

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable message.

  headers:
    RetryAfter:
      description: Seconds to wait before retrying, rounded up, at least 1.
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

    WWWAuthenticate:
      description: Always `Bearer`.
      required: true
      schema:
        type: string

    ClearRefreshCookie:
      description: |
        Clears the `refresh_token` cookie (empty value, already expired). Only in
        `cookie` mode.
      required: false
      schema:
        type: string

  responses:

    ServiceUnavailable:
      description: The database timed out or cannot be reached.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: service unavailable

    InternalError:
      description: Any other error, including a recovered panic. No internal details are exposed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: internal server error

    Accepted:
      description: Accepted, no body. The answer is the same whatever the state of the account.

    NoContent:
      description: Done, no body.
