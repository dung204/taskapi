  /me/password:
    put:
      tags: [me]
      operationId: changePassword
      summary: Change the password
      description: |
        Checks run in this order, which decides the status code:

        1. The body is validated: 400.
        2. The client IP and the email address of the account are checked
           against the login limits: 429 with `Retry-After`. While the address
           is waiting, even the right `current_password` is refused with 429.
        3. `current_password` is verified: 403 when it is wrong.
        4. Otherwise 204.

        A wrong `current_password` is 403, not 401: the access token is fine,
        and a 401 would make a client refresh its token and retry.

        Wrong `current_password` attempts use the same per-email limit as failed
        logins and share its budget: wrong attempts here count against logins
        and the other way round, and a success (here or at login) resets the
        counter. Requests rejected with 400 do not count.

        On success every session of the user is revoked, including this one,
        so the client has to sign in again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          description: |
            Checked before the current password is verified:

            - the body is missing, is not valid JSON, is not an object, or a field has the wrong type
            - `current_password` is missing, empty, longer than 128 characters (counted after Unicode
              NFKC normalization), or not valid UTF-8. A merely short one is not rejected here: it
              is a wrong password and gets 403
            - `new_password` is missing, or not 8 to 128 characters long (counted after Unicode
              NFKC normalization), or not valid UTF-8
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                bodyMissing:
                  summary: "The request has no body"
                  value:
                    error: "request body is required"
                bodyMalformedJson:
                  summary: "The body is cut off or is not JSON"
                  value:
                    error: "request body contains malformed JSON"
                fieldWrongType:
                  summary: "`new_password` is not of the type the schema says"
                  value:
                    error: "field \"new_password\" has the wrong type"
                bodyMalformedJsonAt:
                  summary: "A syntax error in the JSON; the offset is the byte position of the error"
                  value:
                    error: "request body contains malformed JSON (at position 9)"
                bodyNotAnObject:
                  summary: "Valid JSON, but not an object (for example an array or a string)"
                  value:
                    error: "request body must be a JSON object"
                bodyUnreadable:
                  summary: "Any other decoding failure"
                  value:
                    error: "invalid request body"
                currentPasswordInvalid:
                  summary: "`current_password` is missing, empty, or longer than 128 characters (counted after Unicode NFKC normalization)"
                  value:
                    error: "invalid input: invalid password: must not be empty and must have at most 128 characters"
                newPasswordLength:
                  summary: "`new_password` is missing or not 8 to 128 characters long (counted after Unicode NFKC normalization)"
                  value:
                    error: "invalid input: invalid password: length must be between 8 and 128"
                passwordNotUtf8:
                  summary: "`current_password` or `new_password` is not valid UTF-8"
                  value:
                    error: "invalid input: invalid password: must be valid UTF-8"
        "401":
          description: |
            The access token is not accepted. Every case gets the same message and the
            `WWW-Authenticate: Bearer` header, so the answer never says why:

            - there is no `Authorization` header, its scheme is not `Bearer`, or the token is empty
            - the token is not a JWT, is signed with another key, has the wrong issuer or audience, or has expired
            - the token's session was revoked (logout, logout-all, a password change or reset, or reuse of an old refresh token) or it was issued before the user's last "sign out everywhere"
            - the user no longer exists
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/WWWAuthenticate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unauthorized:
                  summary: "Any of the cases above"
                  value:
                    error: "unauthorized"
        "403":
          description: |
            `current_password` is wrong, whatever its length: a password that is merely short
            is wrong, not invalid, so it is a 403 and not a 400. This is a 403 and not a 401
            on purpose: the access token is fine, and a 401 would make a client refresh its
            token and retry. The session stays valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                wrongCurrentPassword:
                  summary: "Wrong current password"
                  value:
                    error: "wrong current password"
        "429":
          description: |
            Checked after the body is valid and before `current_password`:

            - the client IP exceeded the request rate limit that applies to every endpoint
            - the account's email address is waiting after too many failed logins or wrong
              `current_password` attempts (they share one budget): the first few attempts are
              free, then each wrong attempt makes the address wait longer. While it waits,
              **even the right `current_password`** is refused with this status. A success
              resets the counter.

            Wait at least `Retry-After` seconds.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                tooManyRequests:
                  summary: "Rate limit hit or too many wrong attempts"
                  value:
                    error: "too many requests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

