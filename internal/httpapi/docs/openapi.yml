                  summary: "`limit` is lower than 1"
                  value:
                    error: "invalid input: limit is invalid"
                offsetNotInteger:
                  summary: "`offset` is not an integer"
                  value:
                    error: "invalid offset"
                offsetNegative:
                  summary: "`offset` is negative"
                  value:
                    error: "invalid input: offset is invalid"
                statusNotAllowed:
                  summary: "`status` is not a known status"
                  value:
                    error: "invalid input: status must be one of the following: todo, doing, done, overdue"
                scopeNotAllowed:
                  summary: "`scope` is not a known scope"
                  value:
                    error: "invalid input: scope must be one of the following: all, owned, shared"
                assigneeNotAllowed:
                  summary: "`assignee` is not `me`"
                  value:
                    error: "invalid input: assignee must be one of the following: me"
        "401":
          description: |
