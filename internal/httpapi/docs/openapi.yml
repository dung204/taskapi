  /tasks/{id}/invitations:
    post:
      tags: [sharing]
      operationId: inviteToTask
      summary: Share a task with an email address
      description: |
        Owner only. What happens depends on the email address:

        - It belongs to a **verified account**: that user becomes a member at once,
          with no step on their side, and gets an email saying so (no token in it).
          The answer is a `Share` of kind `member`.
        - Otherwise (no account, or an account whose email is not verified yet): a
          pending invitation is created and an email with a link is sent. Nothing is
          shared until the recipient signs in with that address and accepts
          (`POST /invitations/accept`). The answer is a `Share` of kind `invitation`,
          valid for 30 days.

        So the owner can tell which addresses have a verified account. That is on
        purpose, and the limits below make probing many addresses slow. Email
        addresses are compared case-insensitively.

        `assign: true` also makes the person the assignee: at once for a member added
        directly (replacing the current assignee), when the invitation is accepted
        otherwise (replacing whoever is the assignee then).

        A 201 means the share was recorded, not that an email was delivered: mail is
        sent in the background, and an address that received several mails from this
        service in a short time gets none for this share (the share still succeeds).
        To change the role of a pending invitation, cancel it and invite again; the
        new email carries a new token and the old link stops working. A pending
        invitation past its `expires_at` no longer counts, so the address can be
        invited again.

        Checks run in this order, which decides the status code:

        1. The client IP limit: 429.
        2. A path or body that cannot be read: 400.
        3. The task: 404 when the caller cannot see it, 403 when the caller is not its owner.
        4. The values in the body: 400 for the email, 422 for the role.
        5. The email is the owner's own: 422.
        6. The address is already a member, or already has a pending invitation: 409.
        7. The task already has 50 members, or the owner already has 200 pending invitations: 422.
        8. The owner's hourly invitation limit: 429. Only a request that passed every
           check before it counts, so a request rejected with 400, 409 or 422 uses up nothing.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRequest"
      responses:
        "201":
          description: |
            The share that was created: `member` when the address has a verified account
            (the person already has access), `invitation` otherwise.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Share"
              examples:
                memberAdded:
                  summary: The address has a verified account, so the person is added at once
                  value:
                    kind: member
                    id: 0192f5a1-7c3e-7b1a-8d2f-5e6a7b8c9d01
                    email: an@example.com
                    role: editor
                    created_at: "2026-11-16T09:30:00Z"
                invitationSent:
                  summary: The address has no verified account, so an invitation is pending
                  value:
                    kind: invitation
                    id: 0192f5a2-1f4b-7c2d-9a3e-6f7b8c9d0e12
                    email: binh@example.com
                    role: viewer
                    created_at: "2026-11-16T10:05:00Z"
                    expires_at: "2026-12-16T10:05:00Z"
        "400":
          description: |
            Nothing is shared:

            - the `id` in the path is not a valid UUID
            - the body is missing, is not valid JSON, is not an object, or a field has the wrong type
            - `email` is missing, not a valid address, or longer than 254 characters (after trimming)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidId:
                  summary: "The `id` in the path is not a UUID"
                  value:
                    error: "invalid id"
                bodyMissing:
                  summary: "The request has no body"
                  value:
                    error: "request body is required"
                bodyMalformedJson:
                  summary: "The body is cut off or is not JSON"
                  value:
                    error: "request body contains malformed JSON"
                fieldWrongType:
                  summary: "`email` is not of the type the schema says"
                  value:
                    error: "field \"email\" has the wrong type"
                bodyMalformedJsonAt:
                  summary: "A syntax error in the JSON; the offset is the byte position of the error"
                  value:
                    error: "request body contains malformed JSON (at position 9)"
                bodyNotAnObject:
                  summary: "Valid JSON, but not an object (for example an array or a string)"
                  value:
                    error: "request body must be a JSON object"
                bodyUnreadable:
                  summary: "Any other decoding failure"
                  value:
                    error: "invalid request body"
                invalidEmail:
                  summary: "The email is missing, not a valid address, or longer than 254 characters (after trimming)"
                  value:
                    error: "invalid input: invalid email: email must be a valid email and have at most 254 characters"
        "401":
          description: |
            The access token is not accepted. Every case gets the same message and the
            `WWW-Authenticate: Bearer` header, so the answer never says why:

            - there is no `Authorization` header, its scheme is not `Bearer`, or the token is empty
            - the token is not a JWT, is signed with another key, has the wrong issuer or audience, or has expired
            - the token's session was revoked (logout, logout-all, a password change or reset, or reuse of an old refresh token) or it was issued before the user's last "sign out everywhere"
            - the user no longer exists
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/WWWAuthenticate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unauthorized:
                  summary: "Any of the cases above"
                  value:
                    error: "unauthorized"
        "403":
          description: |
            The caller can see the task but is not its owner. Inviting people, cancelling
            invitations, changing roles and removing members belong to the owner alone, and
            no role can be given this right.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                ownerOnly:
                  summary: "The caller is a member, not the owner"
                  value:
                    error: "forbidden: only the owner can manage who a task is shared with"
        "404":
          description: |
            No task has this `id`, or the caller cannot see it: not its owner and not a
            member of it (the two cases are not told apart).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                taskNotFound:
                  summary: "Unknown id, or a task the caller cannot see"
                  value:
                    error: "task: not found"
        "409":
          description: |
            Checked after the email is known to be valid and is not the owner's:

            - the address already belongs to a member of the task
            - the address already has a pending invitation to the task that has not expired yet

            The owner can see both in `GET /tasks/{id}/shares`, so this reveals nothing new.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                alreadyMember:
                  summary: "The address is already a member of the task"
                  value:
                    error: "conflict: this person is already a member of the task"
                alreadyInvited:
                  summary: "The address already has a pending invitation to the task"
                  value:
                    error: "conflict: this email already has a pending invitation for the task"
        "422":
          description: |
            The body is well-formed but cannot be acted on. Nothing is shared:

            - `role` is missing, empty, `owner` (it cannot be granted) or not a known role
            - `email` is the owner's own address
            - the task already has 50 members (the owner is not counted, pending invitations are not counted)
            - the owner already has 200 pending invitations, counted over all of their tasks (a member added directly does not use this budget)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidRole:
                  summary: "`role` is missing, empty, `owner` or not a known role"
                  value:
                    error: "unprocessable: role must be one of the following: viewer, contributor, editor, manager"
                ownEmail:
                  summary: "The email is the owner's own address"
                  value:
                    error: "unprocessable: you cannot invite yourself"
                memberLimit:
                  summary: "The task already has 50 members"
                  value:
                    error: "unprocessable: a task can have at most 50 members"
                pendingLimit:
                  summary: "The owner already has 200 pending invitations"
                  value:
                    error: "unprocessable: you can have at most 200 pending invitations"
        "429":
          description: |
            - the client IP exceeded the request rate limit that applies to every endpoint
              (token bucket per IP; IPv6 addresses are grouped by their /64)
            - the owner already made 30 invitations in the last hour (the number is
              configurable). Members added directly and pending invitations both count,
              and removing a member does not give one back. It is checked last, so only a
              request that would otherwise have succeeded uses it up.

            Wait at least `Retry-After` seconds.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                tooManyRequests:
                  summary: "Rate limit hit"
                  value:
                    error: "too many requests"
                tooManyInvitations:
                  summary: "The owner reached the hourly invitation limit (same message, so a client needs only one rule for 429)"
                  value:
                    error: "too many requests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

