  /invitations/accept:
    post:
      tags: [sharing]
      operationId: acceptInvitation
      summary: Accept an invitation
      description: |
        The link in the invitation email opens a page of the web or mobile app, which
        calls this endpoint with the token in the body. Like `POST /auth/verify-email`
        it is a POST on purpose: mail scanners follow links and would use up the
        token behind a GET.

        The caller must be signed in with the email address the invitation was sent
        to (a signed-in user's email is always verified). The caller becomes a
        member with the invited role and, if the invitation had `assign: true`, the
        assignee of the task, replacing the current one. The invitation is used up.

        The task is not visible to the invited person before this: the email is all
        they have.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationTokenRequest"
      responses:
        "200":
          description: The task, with `role` set to the role that was granted, so an app can open it straight away
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: |
            - the body is missing, is not valid JSON, is not an object, or `token` has the wrong type
            - the token is empty, longer than 128 characters, or cannot be one the server issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                bodyMissing:
                  summary: "The request has no body"
                  value:
                    error: "request body is required"
                bodyMalformedJson:
                  summary: "The body is cut off or is not JSON"
                  value:
                    error: "request body contains malformed JSON"
                fieldWrongType:
                  summary: "`token` is not of the type the schema says"
                  value:
                    error: "field \"token\" has the wrong type"
                bodyMalformedJsonAt:
                  summary: "A syntax error in the JSON; the offset is the byte position of the error"
                  value:
                    error: "request body contains malformed JSON (at position 9)"
                bodyNotAnObject:
                  summary: "Valid JSON, but not an object (for example an array or a string)"
                  value:
                    error: "request body must be a JSON object"
                bodyUnreadable:
                  summary: "Any other decoding failure"
                  value:
                    error: "invalid request body"
                tokenMalformed:
                  summary: "The token is empty, longer than 128 characters, or is not what the server issues (not 43 URL-safe base64 characters)"
                  value:
                    error: "token is invalid"
        "401":
          description: |
            The access token is not accepted. Every case gets the same message and the
            `WWW-Authenticate: Bearer` header, so the answer never says why:

            - there is no `Authorization` header, its scheme is not `Bearer`, or the token is empty
            - the token is not a JWT, is signed with another key, has the wrong issuer or audience, or has expired
            - the token's session was revoked (logout, logout-all, a password change or reset, or reuse of an old refresh token) or it was issued before the user's last "sign out everywhere"
            - the user no longer exists
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/WWWAuthenticate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unauthorized:
                  summary: "Any of the cases above"
                  value:
                    error: "unauthorized"
        "404":
          description: |
            The invitation cannot be used by this caller. Every case gets the same message,
            so the answer never says why, and so a token that was guessed or leaked to the
            wrong person reveals nothing:

            - no pending invitation matches the token: it is unknown, or the invitation was already accepted, declined or cancelled
            - the invitation has expired (30 days after it was created)
            - the invitation was sent to another email address than the one the caller signed in with
            - the task was deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invitationNotFoundOrExpired:
                  summary: "Any of the cases above. All of them give this one message, so the answer never says why"
                  value:
                    error: "invitation not found or expired"
        "409":
          description: |
            The token is valid and belongs to the caller, but the task already has 50
            members, so there is no room. The caller is entitled to know the task exists,
            since the invitation was addressed to them. The invitation stays pending; it
            can be accepted once the owner makes room, and until it expires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                memberLimit:
                  summary: "The task already has 50 members"
                  value:
                    error: "conflict: the task has reached its member limit"
        "429":
          description: |
            The client IP exceeded the request rate limit that applies to every endpoint
            (token bucket per IP; IPv6 addresses are grouped by their /64). Wait at least
            `Retry-After` seconds.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                tooManyRequests:
                  summary: "Rate limit hit"
                  value:
                    error: "too many requests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

