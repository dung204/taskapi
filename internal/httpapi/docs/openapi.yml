            The invitation cannot be used by this caller. Every case gets the same message,
            so the answer never says why, and so a token that was guessed or leaked to the
            wrong person reveals nothing:

            - no pending invitation matches the token: it is unknown, or the invitation was already accepted, declined or cancelled
            - the invitation has expired (30 days after it was created)
            - the invitation was sent to another email address than the one the caller signed in with
            - the task was deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invitationNotFoundOrExpired:
                  summary: "Any of the cases above. All of them give this one message, so the answer never says why"
                  value:
                    error: "invitation not found or expired"
        "429":
          description: |
            The client IP exceeded the request rate limit that applies to every endpoint
            (token bucket per IP; IPv6 addresses are grouped by their /64). Wait at least
            `Retry-After` seconds.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                tooManyRequests:
                  summary: "Rate limit hit"
                  value:
                    error: "too many requests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The access token from `POST /auth/login` or `POST /auth/refresh`. A
        missing, malformed, expired or revoked token is 401.

  parameters:
    TaskId:
      name: id
      in: path
      required: true
      description: Task ID (UUID)
      schema:
        $ref: "#/components/schemas/TaskId"

    Limit:
      name: limit
      in: query
      required: false
      description: |
        Page size. Defaults to 20. A value above 100 is not an error, it is
        clamped to 100. A value below 1 or a non-integer is rejected with 400.
      schema:
        type: integer
        minimum: 1
        default: 20

    Offset:
      name: offset
      in: query
      required: false
      description: Number of tasks to skip. Defaults to 0.
      schema:
        type: integer
        minimum: 0
        default: 0

    StatusFilter:
      name: status
      in: query
      required: false
      description: Only return tasks with this status.
      schema:
        $ref: "#/components/schemas/Status"

    InvitationId:
      name: invitationId
      in: path
      required: true
      description: Invitation ID (UUID)
      schema:
        $ref: "#/components/schemas/InvitationId"

    MemberUserId:
      name: userId
      in: path
      required: true
      description: ID (UUID) of the member's user account. It is the `id` of a `Share` of kind `member`.
      schema:
        $ref: "#/components/schemas/UserId"

    ScopeFilter:
      name: scope
      in: query
      required: false
      description: |
        Which tasks to list: `owned` (the caller is the owner), `shared` (the
        caller is a member), or `all` (both, the default). An empty `scope=` means
        `all`; any other value is rejected with 400.
      schema:
        type: string
        enum: [all, owned, shared]
        default: all

    AssigneeFilter:
      name: assignee
      in: query
      required: false
      description: |
        `me` keeps only the tasks assigned to the caller. It can be combined with
        `scope` and `status`. An empty `assignee=` means no filter; any other value
        is rejected with 400.
      schema:
        type: string
        enum: [me]

    RefreshTokenCookie:
      name: refresh_token
      in: cookie
      required: false
      description: |
        The refresh token, when the client chose `cookie` mode at login. Set by
        the server; browsers send it only to paths under `/auth`.
      schema:
        type: string

    OriginHeader:
      name: Origin
      in: header
      required: false
      description: |
        Sent by browsers. In `cookie` mode it must be one of the allowed
        origins when present, otherwise the request is refused with 403.
        Requests without it (not from a browser) are not checked.
      schema:
        type: string

  schemas:
    TaskId:
      type: string
      format: uuid
      description: UUIDv7, generated by the server.
      x-go-type: uuid.UUID
      x-go-type-import:
        path: uuid

    Status:
      type: string
      enum: [todo, doing, done, overdue]
      description: |
        `overdue` is set only by the server (a background worker, for tasks past
        their `due_at` that are not `done`). Clients can filter by it but cannot
        set it.
      x-go-type: task.Status
      x-go-type-import:
        path: github.com/dung204/taskapi/internal/task

    WritableStatus:
      type: string
      enum: [todo, doing, done]
      description: The statuses a client is allowed to set.
      x-go-type: task.Status
      x-go-type-import:
        path: github.com/dung204/taskapi/internal/task

    Task:
      type: object
      required: [id, title, description, status, due_at, created_at, updated_at, owner_id, assignee, role]
      properties:
        id:
          $ref: "#/components/schemas/TaskId"
        title:
          type: string
          description: 1 to 200 characters after trimming surrounding whitespace.
        description:
          type: string
          maxLength: 2000
        status:
          $ref: "#/components/schemas/Status"
        due_at:
          type: [string, "null"]
          format: date-time
          description: RFC 3339. `null` when the task has no due date.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        owner_id:
          $ref: "#/components/schemas/UserId"
          description: The user who created the task. It never changes.
        assignee:
          description: The user the task is assigned to, `null` when it is assigned to nobody.
          oneOf:
            - $ref: "#/components/schemas/Assignee"
            - type: "null"
        role:
          $ref: "#/components/schemas/Role"
          description: |
            The caller's role on this task (`owner` for the caller's own tasks). It is for
            the app, for example to hide a button; the server checks every request again.

    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 200
          description: |
            Required. 1 to 200 characters after trimming surrounding whitespace;
            a whitespace-only title is rejected.
        description:
          type: string
          maxLength: 2000
          description: Optional, defaults to an empty string.
        status:
          $ref: "#/components/schemas/WritableStatus"
          description: Optional, defaults to `todo`. `overdue` is rejected with 400.
        due_at:
          type: [string, "null"]
          format: date-time
          description: Optional, RFC 3339 (for example `2030-01-01T00:00:00Z`).
          x-go-type: string

    UpdateTaskRequest:
      type: object
      description: |
        Every field is optional; only the fields that are sent are changed.
        An empty object is valid and changes nothing. Note that sending
        `due_at: null` currently counts as "not sent" (the due date is not
        cleared).
      properties:
        title:
          type: string
          maxLength: 200
          description: 1 to 200 characters after trimming; an empty or whitespace-only title is rejected.
        description:
          type: string
          maxLength: 2000
          description: An empty string is allowed and clears the description.
        status:
          $ref: "#/components/schemas/WritableStatus"
          description: "`overdue` is rejected with 400."
        due_at:
          type: [string, "null"]
          format: date-time
          description: RFC 3339.
          x-go-type: string

    UserId:
      type: string
      format: uuid
      description: UUIDv7, generated by the server.
      x-go-type: uuid.UUID
      x-go-type-import:
        path: uuid

    Email:
      type: string
      format: email
      maxLength: 254
      description: Compared case-insensitively; stored in lower case.
      x-go-type: string

    Password:
      type: string
      minLength: 1
      maxLength: 128
      description: |
        The password as typed, for checking against the stored one (`password` of
        a login, `current_password` of a password change). Never returned.

        Only an empty value, a value longer than 128 characters (counted after
        Unicode NFKC normalization) and a value that is not valid UTF-8 are
        rejected with 400. There is no minimum length here: a password that is
        merely short is just a wrong password (401 on login, 403 on a password
        change). The 8-character minimum applies to new passwords only
        (`NewPassword`).
      x-go-type: string

    NewPassword:
      type: string
      minLength: 8
      maxLength: 128
      description: |
        8 to 128 characters, counted after Unicode NFKC normalization, and valid
        UTF-8. There are no composition rules (no required digits or symbols).
      x-go-type: string

    OneTimeToken:
      type: string
      minLength: 1
      maxLength: 128
      description: A single-use token from an email link.
      x-go-type: string

    TokenMode:
      type: string
      enum: [token, cookie]
      default: token
      description: |
        Where the refresh token is delivered. `token`: in the response body.
        `cookie`: in the `refresh_token` cookie only.

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          $ref: "#/components/schemas/NewPassword"

    EmailRequest:
      type: object
      required: [email]
      properties:
        email:
          $ref: "#/components/schemas/Email"

    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token:
          $ref: "#/components/schemas/OneTimeToken"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          $ref: "#/components/schemas/Password"
        token_mode:
          $ref: "#/components/schemas/TokenMode"

    RefreshRequest:
      type: object
      description: |
        Optional. Leave the body out, or send `{}`, when the refresh token is in
        the cookie.
      properties:
        refresh_token:
          type: string
          maxLength: 128
          description: The opaque refresh token.

    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      properties:
        token:
          $ref: "#/components/schemas/OneTimeToken"
        new_password:
          $ref: "#/components/schemas/NewPassword"

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          $ref: "#/components/schemas/Password"
        new_password:
          $ref: "#/components/schemas/NewPassword"

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: |
            A signed JWT. Send it in the `Authorization` header as `Bearer <token>`.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          format: int64
          minimum: 1
          description: Seconds until the access token expires.
        refresh_token:
          type: string
          description: |
            The opaque refresh token. Present only in `token` mode, and absent
            from a grace-period answer of `POST /auth/refresh`.

    User:
      type: object
      required: [id, email, email_verified, created_at]
      properties:
        id:
          $ref: "#/components/schemas/UserId"
        email:
          $ref: "#/components/schemas/Email"
        email_verified:
          type: boolean
        created_at:
          type: string
          format: date-time

    InvitationId:
      type: string
      format: uuid
      description: UUIDv7, generated by the server.
      x-go-type: uuid.UUID
      x-go-type-import:
        path: uuid

    Role:
      type: string
      enum: [viewer, contributor, editor, manager, owner]
      description: |
        The caller's role on a task. Each role can do everything the one before
        it can:

        - `viewer`: see the task and the list of who it is shared with
        - `contributor`: also change the `status`
        - `editor`: also change `title`, `description` and `due_at`
        - `manager`: also set and clear the assignee
        - `owner`: also delete the task and manage who it is shared with

        `owner` is whoever created the task. It cannot be granted or
        transferred, so only the other four can be given to somebody
        (`GrantableRole`). Being the assignee adds nothing to a role.
      x-go-type: task.Role
      x-go-type-import:
        path: github.com/dung204/taskapi/internal/task

    GrantableRole:
      type: string
      enum: [viewer, contributor, editor, manager]
      description: The roles an owner can give to somebody. `owner` is not one of them.
      x-go-type: task.Role
      x-go-type-import:
        path: github.com/dung204/taskapi/internal/task

    Assignee:
      type: object
      required: [id, email]
      description: The user a task is assigned to. Assigning gives no permission by itself.
      properties:
        id:
          $ref: "#/components/schemas/UserId"
        email:
          $ref: "#/components/schemas/Email"

    Share:
      type: object
      required: [kind, id, email, role, created_at]
      description: |
        One line of the list of who a task is shared with: a **member**, who has
        access, or a **pending invitation**, who has none yet. The server never
        returns a token.
      properties:
        kind:
          type: string
          enum: [member, invitation]
          description: |
            `member` for somebody who has access (an invitation that was accepted
            or a person added directly), `invitation` for an invitation that is
            still waiting.
        id:
          type: string
          format: uuid
          description: |
            For a `member`, the user's ID (the `userId` of
            `/tasks/{id}/members/{userId}`). For an `invitation`, the invitation's
            ID (the `invitationId` of `/tasks/{id}/invitations/{invitationId}`).
          x-go-type: uuid.UUID
          x-go-type-import:
            path: uuid
        email:
          $ref: "#/components/schemas/Email"
        role:
          $ref: "#/components/schemas/GrantableRole"
        created_at:
          type: string
          format: date-time
          description: When the member was added, or when the invitation was made.
        expires_at:
          type: string
          format: date-time
          description: Only when `kind` is `invitation`. The invitation stops working at this time.

    InviteRequest:
      type: object
      required: [email, role]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        role:
          $ref: "#/components/schemas/GrantableRole"
          description: Required. `owner` is rejected with 422.
        assign:
          type: boolean
          default: false
          description: Optional. `true` also makes the person the assignee (see the operation).

    ChangeRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/GrantableRole"
          description: Required. `owner` is rejected with 422.

    AssigneeRequest:
      type: object
      required: [email]
      properties:
        email:
          $ref: "#/components/schemas/Email"
          description: The address of the owner or of a member of the task.

    InvitationToken:
      type: string
      minLength: 1
      maxLength: 128
      description: |
        The token from the invitation email, as it is in the link. It is a
        single-use secret: 43 URL-safe base64 characters.
      x-go-type: string

    InvitationTokenRequest:
      type: object
      required: [token]
      properties:
        token:
          $ref: "#/components/schemas/InvitationToken"

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable message.

  headers:
    RetryAfter:
      description: Seconds to wait before retrying, rounded up, at least 1.
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

    WWWAuthenticate:
      description: Always `Bearer`.
      required: true
      schema:
        type: string

    ClearRefreshCookie:
      description: |
        Clears the `refresh_token` cookie (empty value, already expired). Only in
        `cookie` mode.
      required: false
      schema:
        type: string

  responses:

    ServiceUnavailable:
      description: The database timed out or cannot be reached.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: service unavailable

    InternalError:
      description: Any other error, including a recovered panic. No internal details are exposed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: internal server error

    Accepted:
      description: Accepted, no body. The answer is the same whatever the state of the account.

    NoContent:
      description: Done, no body.
