name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_tasks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_tasks"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_tasks?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make ci

      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage.out') != '' }}
        env:
          COVER_LINK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: make cover-summary >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage HTML report
        if: ${{ !cancelled() && hashFiles('coverage.out') != '' }}
        run: go tool cover -html=coverage.out -o coverage.html

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('coverage.html') != '' }}
        with:
          name: coverage
          path: coverage.html
